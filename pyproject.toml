[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "watershed-memory"
version = "0.2.0"
description = "An enduring source-water case across successive watershed observations."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "AIstanbul Research Group"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "strands-agents>=1,<2",
  "bedrock-agentcore>=1,<2",
  "botocore[crt]>=1.43,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
watershed-memory = "watershed_memory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["watershed_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
